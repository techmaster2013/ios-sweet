name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      board:
        description: sweet (Redmi Note 10 Pro) or pi5 (Raspberry Pi 5, adds -DSWEET_BOARD_PI5=1)
        default: pi5
      runner:
        description: macOS runner image (macos-15 arm64 often sits in a capacity queue; macos-15-intel starts at once)
        default: macos-15-intel
      clean:
        description: ignore the incremental build cache (full ~20 min build)
        default: "false"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  BOARD: ${{ inputs.board || 'pi5' }}

jobs:
  build:
    # Needs an Xcode 15.x iig: it matches the xnu-8796 IORPC ABI (Xcode 16's
    # iig emits IORPC.kernelContent, which this xnu lacks). macos-14 had it but
    # is no longer offered; "Deps" below picks the OLDEST Xcode on the image.
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          # Raspberry Pi 5: same SWEET machine config plus one define (0101+ patches,
          # PI5-PORT.md). Edits the added MACHINE_FLAGS line inside 0004, so the
          # patch keeps applying; fails loudly if that line ever changes.
          if [ "$BOARD" = pi5 ]; then
            sed -i '' 's/^\(+MACHINE_FLAGS_ARM64_SWEET = -DARM64_BOARD_CONFIG_SWEET.*\)$/\1 -DSWEET_BOARD_PI5=1/' dxb/patches/0004-sweet-machine-config.patch
            grep -c 'SWEET_BOARD_PI5=1' dxb/patches/0004-sweet-machine-config.patch
          elif [ "$BOARD" != sweet ]; then
            echo "unknown board $BOARD" >&2; exit 1
          fi
          ls dxb/patches
          # Incremental builds: after build.sh patches a fresh xnu checkout, a
          # hook syncs only content-changed files into the cached tree (see
          # "Incremental cache"), so make recompiles just those.
          perl -pi -e 's/^    patches$/    patches\n    [ -n "\$\{POST_PATCH_HOOK:-}" ] && bash "\$\{POST_PATCH_HOOK}"/' dxb/build.sh
          grep -n -A1 '^    patches$' dxb/build.sh
          grep -c 'bash "${POST_PATCH_HOOK}"' dxb/build.sh

      # Everything build.sh produces, keyed per runner type, board and build
      # script; restore-keys pick the newest entry for the same combination.
      - name: Restore incremental cache
        id: cache
        if: inputs.clean != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            dxb/*
            !dxb/.git
            !dxb/patches
            !dxb/build.sh
          key: xnu-${{ inputs.runner || 'macos-15-intel' }}-${{ env.BOARD }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.DXB_SHA }}-${{ github.run_id }}
          restore-keys: |
            xnu-${{ inputs.runner || 'macos-15-intel' }}-${{ env.BOARD }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.DXB_SHA }}-

      - name: Incremental cache
        if: steps.cache.outputs.cache-matched-key != ''
        run: |
          # build.sh clones xnu only when dxb/xnu is missing: give it a clean
          # local clone of the cached repo (no network), patched from scratch.
          mv dxb/xnu dxb/xnu.cached
          git clone -q --no-checkout dxb/xnu.cached dxb/xnu
          git -C dxb/xnu checkout -q "$(git -C dxb/xnu.cached rev-parse HEAD)"
          # The kernel's presence makes build.sh skip make: remove it.
          rm -f dxb/build/xnu.obj/kernel.* || true
          cat > "$RUNNER_TEMP/post-patch.sh" <<'EOF'
          set -e
          cd "$GITHUB_WORKSPACE/dxb"
          # Content-changed files only; unchanged ones keep their cached mtimes.
          rsync -a --checksum --delete --exclude .git xnu/ xnu.cached/
          rm -rf xnu
          mv xnu.cached xnu
          echo "incremental: synced the freshly patched tree into the cached one"
          EOF
          echo "POST_PATCH_HOOK=$RUNNER_TEMP/post-patch.sh" >> "$GITHUB_ENV"
          echo "restored ${{ steps.cache.outputs.cache-matched-key }}"

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      # Only full builds save (an upload of the whole tree): incremental builds
      # reuse that base and recompile everything changed since it. Run once with
      # clean=true to refresh the base when incremental builds get slow.
      - name: Save incremental cache
        if: success() && steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: |
            dxb/*
            !dxb/.git
            !dxb/patches
            !dxb/build.sh
          key: xnu-${{ inputs.runner || 'macos-15-intel' }}-${{ env.BOARD }}-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.DXB_SHA }}-${{ github.run_id }}

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
